# Example only: create the real secret out of band (sealed secrets, external secrets, your IaC), never commit it.
apiVersion: v1
kind: Secret
metadata:
  name: switchboard
  namespace: switchboard
type: Opaque
stringData:
  # ANTHROPIC_API_KEY: "<API key>"   # only without Workload Identity Federation (see deployment.yaml)
  CLAUDE_WEBHOOK_SECRET: "<whsec_… signing secret of the webhook endpoint>"
  SWITCHBOARD_MCP_TOKENS: '{"<random token, 32+ chars>": {"name": "ops-agent", "channels": ["ops"]}}'
