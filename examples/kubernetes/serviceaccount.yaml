# Workload identity: the pod gets a projected token for this service account. Two Entra identities trust it
# through federated credentials with subject system:serviceaccount:switchboard:switchboard:
#   - the bot's app registration (Teams sign-in, CONNECTIONS__..._CLIENTID in the Deployment)
#   - a user-assigned managed identity for Table Storage (the client-id annotation below → AZURE_CLIENT_ID)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: switchboard
  namespace: switchboard
  annotations:
    azure.workload.identity/client-id: "<managed identity client id>"
    azure.workload.identity/tenant-id: "<tenant id>"
