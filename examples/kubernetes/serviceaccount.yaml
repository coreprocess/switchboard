# Workload identity: the pods get projected tokens for this service account. Three identities trust it through
# federated credentials or rules with subject system:serviceaccount:switchboard:switchboard:
#   - the bot's app registration (Teams sign-in and Graph, CONNECTIONS__..._CLIENTID in the Deployment)
#   - a user-assigned managed identity for Table Storage (the client-id annotation below → AZURE_CLIENT_ID)
#   - a Claude workload identity federation rule per workspace (audience https://api.anthropic.com)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: switchboard
  namespace: switchboard
  annotations:
    azure.workload.identity/client-id: "<managed identity client id>"
    azure.workload.identity/tenant-id: "<tenant id>"
