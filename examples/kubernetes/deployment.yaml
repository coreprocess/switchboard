# Several pods: all state and coordination live in Table Storage, any pod handles any request, and a pod that
# goes away hands its session leases over (another pod takes them within a minute). Rolling updates are fine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: switchboard
  namespace: switchboard
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: switchboard
  template:
    metadata:
      labels:
        app: switchboard
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: switchboard
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: switchboard
          image: ghcr.io/coreprocess/switchboard:1.0.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: switchboard
            - secretRef:
                name: switchboard
          env:
            # Teams sign-in (and Graph) as the bot's app registration, through workload identity: no secret.
            - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHTYPE
              value: WorkloadIdentity
            - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__CLIENTID
              value: "<bot app registration client id>"
            - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__TENANTID
              value: "<tenant id>"
            - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__AUTHORITY
              value: https://login.microsoftonline.com/<tenant id>
            - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__FEDERATEDTOKENFILE
              value: /var/run/secrets/azure/tokens/azure-identity-token
            - name: CONNECTIONS__SERVICE_CONNECTION__SETTINGS__SCOPE
              value: https://api.botframework.com
            # Claude sign-in: the SDK exchanges this projected token per workspace (SWITCHBOARD_WORKSPACES)
            - name: ANTHROPIC_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/anthropic.com/token
          volumeMounts:
            - name: anthropic-token
              mountPath: /var/run/secrets/anthropic.com
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            # ready only while Table Storage answers
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ "ALL" ]
      volumes:
        # Claude accepts each token once; the kubelet replaces it at 80% of its lifetime, so the SDK finds a new
        # one at every refresh (federation rule token lifetime 3600 s). A container restart in the same pod waits
        # for the next replacement (up to about 8 minutes); a new pod starts with a fresh token.
        - name: anthropic-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: https://api.anthropic.com
                  expirationSeconds: 600
                  path: token
        - name: tmp
          emptyDir: {}
